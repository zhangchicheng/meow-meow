[package]
name = "nano_shooter"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.19.1", features = ["wav"] }
bevy_ecs_tiled = "0.13.4"
bevy_aseprite_ultra = "0.9.0"
rand = "0.9"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Match the installed wasm-bindgen CLI and enable browser-backed random numbers.
wasm-bindgen = "=0.2.128"
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

[features]
default = ["dev"]
# System names in error messages + hot-reloading of assets (edit the map in Tiled while the game runs).
# Build without it for release: `cargo build --release --no-default-features`.
dev = ["bevy/dev"]

# Pixel-art games are CPU heavy in debug; optimise dependencies but keep our crate fast to compile.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
